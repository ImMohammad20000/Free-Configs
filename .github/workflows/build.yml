name: Build subscription

on:
  schedule:
    # Every 24h. GitHub queues scheduled runs and can delay or skip them under
    # load, so treat this as "about once a day" rather than a precise clock.
    # An off-peak minute (not :00) tends to be dispatched more promptly.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push-retry below rebases onto origin, and a
          # depth-1 clone has no merge base for that to work against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the transform rules
        run: python scripts/test_rules.py

      - name: Install newest Xray-core
        env:
          # patterniha/Xray-core, not XTLS/Xray-core. The fork drops the
          # validateOutboundTransportSecurity check that forbids VLESS/Trojan
          # without TLS to a public address, which is exactly what every port
          # 8080 node in this list is.
          #
          # The newest release is resolved at run time, so publishing a release
          # in the fork is all it takes for the next build to pick it up. The
          # archive is checked against the SHA2-256 the release publishes
          # alongside it: that catches a truncated or corrupted download, but
          # since both files come from the same release it is not a defence
          # against the release itself being replaced. scripts/build.py then
          # preflights the core and fails if it does not support fm/cs/fp.
          XRAY_REPO: patterniha/Xray-core
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${XRAY_REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          # /releases/latest ignores pre-releases; fall back to the most recent
          # release of any kind so a pre-release-only fork still resolves.
          tag="$(curl -fsSL --retry 3 --retry-delay 5 "${auth[@]}" "${api}/releases/latest" \
                 | jq -r '.tag_name // empty' || true)"
          if [ -z "$tag" ]; then
            tag="$(curl -fsSL --retry 3 --retry-delay 5 "${auth[@]}" "${api}/releases?per_page=1" \
                   | jq -r '.[0].tag_name // empty')"
          fi
          if [ -z "$tag" ]; then
            echo "could not resolve a release tag from ${XRAY_REPO}" >&2
            exit 1
          fi
          echo "Newest ${XRAY_REPO} release: ${tag}"

          base="https://github.com/${XRAY_REPO}/releases/download/${tag}"
          zip="$RUNNER_TEMP/xray.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip" "${base}/Xray-linux-64.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip.dgst" "${base}/Xray-linux-64.zip.dgst"

          expected="$(awk '/^SHA2-256=/ {print $2}' "$zip.dgst")"
          if [ -z "$expected" ]; then
            echo "no SHA2-256 line in Xray-linux-64.zip.dgst for ${tag}" >&2
            exit 1
          fi
          echo "${expected}  ${zip}" | sha256sum -c -

          unzip -q "$zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version | head -n 1
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Fetch, transform and health-check
        run: python scripts/build.py

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- configs.txt configs_base64.txt)" ]; then
            echo "configs.txt unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.txt configs_base64.txt
          # grep -c exits 1 on a zero count, which set -e would turn into a
          # failed step; build.py already refuses to publish an empty list.
          nodes="$(grep -cv '^#' configs.txt || true)"
          git commit -m "Update configs (${nodes:-0} nodes)"
          for attempt in 1 2 3; do
            # Explicit refspec: does not rely on the checkout having configured
            # an upstream for the local branch.
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}); rebasing onto origin"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "could not push after 3 attempts" >&2
          exit 1
